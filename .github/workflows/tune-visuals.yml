name: Tune visuals
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tune-visuals.yml'
      - 'scripts/tune_visuals.py'

jobs:
  tune:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply yellow-black tank palette
        run: python3 scripts/tune_visuals.py
      - name: Verify
        run: |
          cargo fmt --all -- --check
          cargo test --all-targets --all-features
          cargo build --all-targets
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.rs
          git commit -m 'style: make tanks yellow and black'
          git rm .github/workflows/tune-visuals.yml scripts/tune_visuals.py
          git commit -m 'chore: remove one-time visual tuning helper'
          git push origin main
