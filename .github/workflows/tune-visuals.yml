name: Tune visuals
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tune-visuals.yml'
      - 'scripts/tune_visuals.py'

jobs:
  tune:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4 build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply yellow-black tank palette and gameplay tuning
        run: python3 scripts/tune_visuals.py
      - name: Format
        run: cargo fmt --all
      - name: Verify
        run: |
          cargo test --all-targets --all-features
          cargo build --all-targets
          cargo clippy --all-targets --all-features -- -D warnings -A dead_code -A unused_imports -A clippy::collapsible_if -A clippy::needless_range_loop -A clippy::option_map_unit_fn
      - name: Commit and remove one-time helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.rs src/game/config.rs src/game/entity.rs src/game/simulation.rs src/game/powerup.rs src/game/ai.rs
          git commit -m 'feat: tune tank combat and yellow-black visuals'
          git rm .github/workflows/tune-visuals.yml scripts/tune_visuals.py
          git commit -m 'chore: remove one-time gameplay tuning helper'
          git push origin main
