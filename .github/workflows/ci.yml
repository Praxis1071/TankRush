name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install GTK4 development packages
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Build
        run: cargo build --all-targets
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -A dead_code -A unused_imports -A clippy::collapsible_if -A clippy::needless_range_loop -A clippy::option_map_unit_fn
