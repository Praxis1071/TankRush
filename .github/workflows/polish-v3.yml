name: Direct polish v3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install GTK4 development packages
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - name: Apply visual and UX polish
        run: |
          python3 <<'PY'
          from pathlib import Path

          main = Path('src/main.rs')
          s = main.read_text()

          s = s.replace(
              'struct MatchRuntime {\n',
              '''#[derive(Debug, Clone, Copy)]
          struct VisualOptions {
              show_names: bool,
              show_powerup_labels: bool,
              high_contrast: bool,
          }

          struct MatchRuntime {
          '''
          )
          s = s.replace(
              '    paused: bool,\n}',
              '    paused: bool,\n    guided_projectiles: Vec<game::ProjectileId>,\n    powerups_enabled: bool,\n}'
          )
          s = s.replace(
              '    fn new(human_count: usize, map_size: MapSize, names: Vec<String>, seed: u32) -> Self {',
              '    fn new(human_count: usize, map_size: MapSize, names: Vec<String>, seed: u32, powerups_enabled: bool) -> Self {'
          )
          s = s.replace(
              '            paused: false,\n        };',
              '            paused: false,\n            guided_projectiles: Vec::new(),\n            powerups_enabled,\n        };'
          )
          s = s.replace(
              '        self.paused = false;\n        let spawns',
              '        self.paused = false;\n        self.guided_projectiles.clear();\n        let spawns'
          )
          old_powerups = '''        self.powerups.clear();
        while self.powerups.len() < 5 {
            self.powerups.push(PowerUp::generate(
                &self.simulation.map,
                &mut self.powerup_seed,
            ));
        }'''
          new_powerups = '''        self.powerups.clear();
        if self.powerups_enabled {
            while self.powerups.len() < 5 {
                self.powerups.push(PowerUp::generate(
                    &self.simulation.map,
                    &mut self.powerup_seed,
                ));
            }
        }'''
          if old_powerups not in s:
              raise SystemExit('powerup spawn marker not found')
          s = s.replace(old_powerups, new_powerups, 1)

          s = s.replace(
              '                    projectile.remaining_lifetime = 5.0;\n                }',
              '                    projectile.remaining_lifetime = 5.0;\n                    self.guided_projectiles.push(projectile.id);\n                }',
              1
          )

          old_guide = '''    fn guide_projectiles(&mut self) {
        for projectile in &mut self.simulation.state.projectiles {
            let Some(owner_tank) = self
                .simulation
                .state
                .tanks
                .iter()
                .find(|t| t.player_id == projectile.owner)
            else {
                continue;
            };
            let Some(target) = self
                .simulation
                .state
                .tanks
                .iter()
                .filter(|t| t.alive && t.player_id != projectile.owner)
                .min_by(|a, b| {
                    ((a.position - projectile.position).length())
                        .total_cmp(&((b.position - projectile.position).length()))
                })
            else {
                continue;
            };
            if self.weapons[owner_tank.player_id.0 as usize] == Some(PowerUpKind::GuidedMissile) {
                let desired = (target.position - projectile.position).normalized();
                let speed = projectile.velocity.length();
                projectile.velocity =
                    (projectile.velocity.normalized() * 0.88 + desired * 0.12).normalized() * speed;
            }
        }
    }'''
          new_guide = '''    fn guide_projectiles(&mut self) {
        self.guided_projectiles.retain(|id| {
            self.simulation.state.projectiles.iter().any(|projectile| projectile.id == *id)
        });
        let targets = self
            .simulation
            .state
            .tanks
            .iter()
            .filter(|tank| tank.alive)
            .map(|tank| (tank.player_id, tank.position))
            .collect::<Vec<_>>();
        for projectile in &mut self.simulation.state.projectiles {
            if !self.guided_projectiles.contains(&projectile.id) {
                continue;
            }
            let Some((_, target_position)) = targets
                .iter()
                .filter(|(id, _)| *id != projectile.owner)
                .min_by(|a, b| {
                    ((a.1 - projectile.position).length())
                        .total_cmp(&((b.1 - projectile.position).length()))
                })
            else {
                continue;
            };
            let desired = (*target_position - projectile.position).normalized();
            let speed = projectile.velocity.length();
            projectile.velocity =
                (projectile.velocity.normalized() * 0.84 + desired * 0.16).normalized() * speed;
        }
    }'''
          if old_guide not in s:
              raise SystemExit('guided projectile function marker not found')
          s = s.replace(old_guide, new_guide)

          s = s.replace(
              '                    &self.simulation.config,\n                    ai_id,\n                    dt,',
              '                    &self.simulation.config,\n                    &self.powerups,\n                    ai_id,\n                    dt,'
          )

          s = s.replace(
              '    fn collect_powerups(&mut self) {\n',
              '    fn collect_powerups(&mut self) {\n        if !self.powerups_enabled {\n            return;\n        }\n'
          )

          s = s.replace(
              'fn draw_game(context: &Context, width: i32, height: i32, runtime: &MatchRuntime) {',
              'fn draw_game(context: &Context, width: i32, height: i32, runtime: &MatchRuntime, options: VisualOptions) {'
          )
          s = s.replace(
              '    context.set_source_rgb(0.88, 0.89, 0.90);',
              '    if options.high_contrast {\n        context.set_source_rgb(0.96, 0.96, 0.96);\n    } else {\n        context.set_source_rgb(0.88, 0.89, 0.90);\n    }',
              1
          )
          s = s.replace(
              '        context.set_source_rgb(0.08, 0.08, 0.08);\n        context.set_font_size(7.0);\n        context.move_to(\n            (powerup.position.x - 15.0) as f64,\n            (powerup.position.y + 3.0) as f64,\n        );\n        context.show_text(powerup.kind.label()).ok();',
              '        if options.show_powerup_labels {\n            context.set_source_rgb(0.08, 0.08, 0.08);\n            context.set_font_size(7.0);\n            context.move_to(\n                (powerup.position.x - 15.0) as f64,\n                (powerup.position.y + 3.0) as f64,\n            );\n            context.show_text(powerup.kind.label()).ok();\n        }'
          )

          old_tanks = '''    for tank in &simulation.state.tanks {
        if !tank.alive {
            continue;
        }
        let color = if runtime.ai_id == Some(tank.player_id) {
            (0.36, 0.37, 0.39)
        } else {
            PLAYER_COLORS[tank.player_id.0 as usize % PLAYER_COLORS.len()]
        };
        context.set_source_rgb(color.0, color.1, color.2);
        context.save().ok();
        context.translate(tank.position.x as f64, tank.position.y as f64);
        context.rotate(tank.rotation_radians as f64);
        context.rectangle(-16.0, -12.0, 32.0, 24.0);
        context.fill().ok();
        context.restore().ok();
        let direction = tank.direction();
        context.set_line_width(7.0);
        context.set_line_cap(gtk4::cairo::LineCap::Round);
        context.move_to(tank.position.x as f64, tank.position.y as f64);
        context.line_to(
            (tank.position.x + direction.x * 22.0) as f64,
            (tank.position.y + direction.y * 22.0) as f64,
        );
        context.stroke().ok();
        context.set_source_rgb(0.92, 0.94, 0.96);
        context.set_font_size(11.0);
        context.move_to(
            (tank.position.x - 22.0) as f64,
            (tank.position.y - 21.0) as f64,
        );
        context.show_text(&runtime.player_name(tank.player_id)).ok();
    }'''
          new_tanks = '''    for tank in &simulation.state.tanks {
        if !tank.alive {
            context.set_source_rgba(0.10, 0.10, 0.10, 0.24);
            context.arc(tank.position.x as f64, tank.position.y as f64, 18.0, 0.0, std::f64::consts::TAU);
            context.fill().ok();
            continue;
        }
        let color = if runtime.ai_id == Some(tank.player_id) {
            (0.38, 0.39, 0.41)
        } else {
            PLAYER_COLORS[tank.player_id.0 as usize % PLAYER_COLORS.len()]
        };
        context.save().ok();
        context.translate(tank.position.x as f64, tank.position.y as f64);
        context.rotate(tank.rotation_radians as f64);

        // Ground shadow and two chunky tracks.
        context.set_source_rgba(0.02, 0.03, 0.04, 0.28);
        context.rectangle(-19.0, -14.0, 38.0, 28.0);
        context.fill().ok();
        context.set_source_rgb(0.08, 0.09, 0.10);
        context.rectangle(-18.0, -14.0, 36.0, 5.0);
        context.rectangle(-18.0, 9.0, 36.0, 5.0);
        context.fill().ok();

        // Armored hull with a crisp player-color band.
        context.set_source_rgb(color.0 * 0.78, color.1 * 0.78, color.2 * 0.78);
        context.rectangle(-15.0, -10.0, 30.0, 20.0);
        context.fill().ok();
        context.set_source_rgb(color.0, color.1, color.2);
        context.rectangle(-14.0, -8.0, 28.0, 5.0);
        context.fill().ok();

        // Turret ring and central hatch.
        context.set_source_rgb(0.16, 0.17, 0.18);
        context.arc(0.0, 0.0, 9.0, 0.0, std::f64::consts::TAU);
        context.fill().ok();
        context.set_source_rgb(0.32, 0.33, 0.34);
        context.arc(0.0, 0.0, 5.5, 0.0, std::f64::consts::TAU);
        context.fill().ok();

        // All cannon barrels are deliberately black for a consistent silhouette.
        context.set_source_rgb(0.015, 0.015, 0.018);
        context.set_line_width(7.0);
        context.set_line_cap(gtk4::cairo::LineCap::Round);
        context.move_to(1.0, 0.0);
        context.line_to(25.0, 0.0);
        context.stroke().ok();
        context.set_source_rgb(0.35, 0.36, 0.37);
        context.set_line_width(2.0);
        context.move_to(10.0, 0.0);
        context.line_to(25.0, 0.0);
        context.stroke().ok();

        if runtime.ai_id == Some(tank.player_id) {
            // Laika: darker body, red sensor eyes.
            context.set_source_rgb(0.70, 0.06, 0.07);
            context.arc(0.0, -2.5, 1.5, 0.0, std::f64::consts::TAU);
            context.arc(0.0, 2.5, 1.5, 0.0, std::f64::consts::TAU);
            context.fill().ok();
        }
        context.restore().ok();

        // Small projectile trail improves readability at high speed without extra textures.
        let direction = tank.direction();
        if options.high_contrast {
            context.set_source_rgba(0.0, 0.0, 0.0, 0.22);
            context.set_line_width(2.0);
            context.move_to(tank.position.x as f64, tank.position.y as f64);
            context.line_to(
                (tank.position.x - direction.x * 18.0) as f64,
                (tank.position.y - direction.y * 18.0) as f64,
            );
            context.stroke().ok();
        }
        if options.show_names {
            context.set_source_rgb(0.12, 0.14, 0.16);
            context.set_font_size(11.0);
            context.move_to(
                (tank.position.x - 22.0) as f64,
                (tank.position.y - 21.0) as f64,
            );
            context.show_text(&runtime.player_name(tank.player_id)).ok();
        }
    }'''
          if old_tanks not in s:
              raise SystemExit('tank drawing marker not found')
          s = s.replace(old_tanks, new_tanks)

          s = s.replace(
              '    for projectile in &simulation.state.projectiles {\n        context.set_source_rgb(1.0, 0.84, 0.22);',
              '''    for projectile in &simulation.state.projectiles {
        let velocity = projectile.velocity.normalized();
        context.set_source_rgba(1.0, 0.78, 0.16, 0.22);
        context.set_line_width(2.5);
        context.move_to(
            (projectile.position.x - velocity.x * 12.0) as f64,
            (projectile.position.y - velocity.y * 12.0) as f64,
        );
        context.line_to(projectile.position.x as f64, projectile.position.y as f64);
        context.stroke().ok();
        context.set_source_rgb(1.0, 0.84, 0.22);'''
          )

          s = s.replace(
              '    context.show_text(&score).ok();',
              '''    context.show_text(&score).ok();
    context.set_source_rgb(0.18, 0.20, 0.22);
    context.set_font_size(11.0);
    context.move_to(18.0, 70.0);
    context.show_text("Esc: Pause  •  Ricochet shells  •  Collect power-ups").ok();'''
          )

          s = s.replace(
              '    let runtime = Rc::new(RefCell::new(MatchRuntime::new(\n        player_count,\n        map_size,\n        names,\n        arena_seed(),\n    )));',
              '    let runtime = Rc::new(RefCell::new(MatchRuntime::new(player_count, map_size, names, arena_seed(), powerups_enabled)));'
          )
          s = s.replace(
              'fn build_game_screen(\n    stack: &Stack,\n    player_count: usize,\n    map_size: MapSize,\n    names: Vec<String>,\n    bindings: Vec<ControlBindings>,\n) -> (Box, DrawingArea) {',
              '''fn build_game_screen(
    stack: &Stack,
    player_count: usize,
    map_size: MapSize,
    names: Vec<String>,
    bindings: Vec<ControlBindings>,
    powerups_enabled: bool,
    visual_options: VisualOptions,
) -> (Box, DrawingArea) {'''
          )
          s = s.replace(
              'draw_game(context, width, height, &runtime.borrow())',
              'draw_game(context, width, height, &runtime.borrow(), visual_options)'
          )

          s = s.replace(
              'fn build_setup_screen(\n    stack: &Stack,\n    player_count: SpinButton,\n    bindings: Rc<RefCell<Vec<ControlBindings>>>,\n) -> Box {',
              '''fn build_setup_screen(
    stack: &Stack,
    player_count: SpinButton,
    bindings: Rc<RefCell<Vec<ControlBindings>>>,
    visual_options: Rc<RefCell<VisualOptions>>,
) -> Box {'''
          )
          marker = '    root.append(&Label::new(Some("Arena size")));\n    root.append(&maps);'
          replacement = '''    root.append(&Label::new(Some("Arena size")));
    root.append(&maps);
    let powerups = CheckButton::with_label("Power-ups enabled");
    powerups.set_active(true);
    powerups.set_tooltip_text(Some("Collect temporary weapons such as Laser, Machine Gun and Guided Missile."));
    root.append(&powerups);'''
          if marker not in s:
              raise SystemExit('setup powerup marker not found')
          s = s.replace(marker, replacement, 1)

          s = s.replace(
              '        let (game, area) = build_game_screen(\n            &stack_start,\n            count,\n            map_size,\n            names,\n            bindings_start.borrow().clone(),\n        );',
              '''        let (game, area) = build_game_screen(
            &stack_start,
            count,
            map_size,
            names,
            bindings_start.borrow().clone(),
            powerups.is_active(),
            *visual_options.borrow(),
        );'''
          )

          s = s.replace(
              'fn build_menu_screen(stack: &Stack, audio: Rc<RefCell<game::config::AudioSettings>>) -> Box {',
              'fn build_menu_screen(stack: &Stack, audio: Rc<RefCell<game::config::AudioSettings>>, visual_options: Rc<RefCell<VisualOptions>>) -> Box {'
          )
          settings_marker = '        general.append(&effects);\n        general.append(&Label::new(Some("Gameplay")));'
          settings_replacement = '''        general.append(&effects);
        general.append(&Label::new(Some("Accessibility & presentation")));
        let show_names = CheckButton::with_label("Show tank names");
        let show_powerup_labels = CheckButton::with_label("Show power-up labels");
        let high_contrast = CheckButton::with_label("High-contrast arena");
        {
            let current = *visual_options.borrow();
            show_names.set_active(current.show_names);
            show_powerup_labels.set_active(current.show_powerup_labels);
            high_contrast.set_active(current.high_contrast);
        }
        {
            let options = Rc::clone(&visual_options);
            show_names.connect_toggled(move |b| options.borrow_mut().show_names = b.is_active());
        }
        {
            let options = Rc::clone(&visual_options);
            show_powerup_labels.connect_toggled(move |b| options.borrow_mut().show_powerup_labels = b.is_active());
        }
        {
            let options = Rc::clone(&visual_options);
            high_contrast.connect_toggled(move |b| options.borrow_mut().high_contrast = b.is_active());
        }
        general.append(&show_names);
        general.append(&show_powerup_labels);
        general.append(&high_contrast);
        general.append(&Label::new(Some("Gameplay")));'''
          if settings_marker not in s:
              raise SystemExit('settings marker not found')
          s = s.replace(settings_marker, settings_replacement, 1)

          s = s.replace(
              '    let audio = Rc::new(RefCell::new(game::config::AudioSettings::default()));\n    let stack = Stack::new();',
              '''    let audio = Rc::new(RefCell::new(game::config::AudioSettings::default()));
    let visual_options = Rc::new(RefCell::new(VisualOptions {
        show_names: true,
        show_powerup_labels: true,
        high_contrast: false,
    }));
    let stack = Stack::new();'''
          )
          s = s.replace(
              '    let menu = build_menu_screen(&stack, Rc::clone(&audio));',
              '    let menu = build_menu_screen(&stack, Rc::clone(&audio), Rc::clone(&visual_options));'
          )
          s = s.replace(
              '    let setup = build_setup_screen(&stack, players, bindings);',
              '    let setup = build_setup_screen(&stack, players, bindings, Rc::clone(&visual_options));'
          )

          main.write_text(s)

          map = Path('src/game/map.rs')
          m = map.read_text()
          if 'let extra_openings = room_count * 2;' not in m:
              raise SystemExit('map opening marker not found')
          m = m.replace('let extra_openings = room_count * 2;', 'let extra_openings = room_count * 3;')
          map.write_text(m)
          PY
      - name: Format and verify
        run: |
          cargo fmt --all
          cargo test --all-targets --all-features
          cargo build --all-targets --all-features
          cargo clippy --all-targets --all-features -- -D warnings -A dead_code -A unused_imports -A clippy::collapsible_if -A clippy::needless_range_loop -A clippy::option_map_unit_fn
      - name: Commit polish batch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/polish-v3.yml
          git add src/main.rs src/game/map.rs .github/workflows/polish-v3.yml
          git commit -m "feat: polish arenas tanks and player options"
          git push
