name: Direct roadmap v1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libasound2-dev
      - name: Apply roadmap implementation
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def write(path, text):
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(text)

          cargo = Path('Cargo.toml')
          s = cargo.read_text()
          if 'rodio = ' not in s:
              s = s.replace('glib = "0.21"', 'glib = "0.21"\nrodio = { version = "0.22", default-features = false, features = ["playback"] }')
              cargo.write_text(s)

          write('src/settings.rs', r'''use std::fs;
use std::path::PathBuf;

use crate::game::config::AudioSettings;

#[derive(Debug, Clone)]
pub struct UserSettings {
    pub audio: AudioSettings,
    pub map_size: String,
    pub player_count: usize,
}

impl Default for UserSettings {
    fn default() -> Self {
        Self { audio: AudioSettings::default(), map_size: "Medium Arena".into(), player_count: 2 }
    }
}

impl UserSettings {
    fn path() -> PathBuf {
        if let Some(dir) = std::env::var_os("XDG_CONFIG_HOME") {
            return PathBuf::from(dir).join("tankrush/settings.conf");
        }
        std::env::var_os("HOME").map(PathBuf::from).unwrap_or_else(|| PathBuf::from("."))
            .join(".config/tankrush/settings.conf")
    }

    pub fn load() -> Self {
        let Ok(text) = fs::read_to_string(Self::path()) else { return Self::default(); };
        let mut out = Self::default();
        for line in text.lines() {
            let Some((key, value)) = line.split_once('=') else { continue; };
            match key.trim() {
                "music" => out.audio.music_enabled = value.trim() == "true",
                "effects" => out.audio.sound_effects_enabled = value.trim() == "true",
                "map_size" => out.map_size = value.trim().to_owned(),
                "player_count" => out.player_count = value.trim().parse().unwrap_or(2).clamp(1, 4),
                _ => {}
            }
        }
        out
    }

    pub fn save(&self) {
        let path = Self::path();
        if let Some(parent) = path.parent() { let _ = fs::create_dir_all(parent); }
        let text = format!("music={}\neffects={}\nmap_size={}\nplayer_count={}\n", self.audio.music_enabled, self.audio.sound_effects_enabled, self.map_size, self.player_count);
        let _ = fs::write(path, text);
    }
}

#[cfg(test)]
mod tests {
    use super::*;
    #[test]
    fn defaults_are_sane() {
        let settings = UserSettings::default();
        assert_eq!(settings.player_count, 2);
        assert!(settings.audio.music_enabled);
    }
}
''')

          write('src/vfx.rs', r'''use crate::game::Vec2;

#[derive(Debug, Clone, Copy)]
pub struct Particle { pub position: Vec2, pub velocity: Vec2, pub life: f32, pub max_life: f32, pub radius: f32, pub kind: ParticleKind }
#[derive(Debug, Clone, Copy, PartialEq, Eq)]
pub enum ParticleKind { Spark, Smoke, Muzzle, Explosion }
#[derive(Debug, Default, Clone)]
pub struct VfxSystem { pub particles: Vec<Particle>, seed: u32 }

impl VfxSystem {
    pub fn new(seed: u32) -> Self { Self { seed, ..Self::default() } }
    fn random(&mut self) -> f32 { self.seed = self.seed.wrapping_mul(1_664_525).wrapping_add(1_013_904_223); self.seed as f32 / u32::MAX as f32 }
    pub fn update(&mut self, dt: f32) {
        for p in &mut self.particles { p.position = p.position + p.velocity * dt; p.velocity = p.velocity * (1.0 - (dt * 2.5).min(0.9)); p.life -= dt; }
        self.particles.retain(|p| p.life > 0.0);
    }
    pub fn trail(&mut self, position: Vec2, velocity: Vec2) {
        if self.particles.len() >= 900 { return; }
        let d = velocity.normalized();
        self.particles.push(Particle { position: position - d * 3.0, velocity: d * -8.0, life: 0.16, max_life: 0.16, radius: 2.0, kind: ParticleKind::Smoke });
    }
    pub fn muzzle(&mut self, position: Vec2, direction: Vec2) {
        for _ in 0..4 { let angle = direction.y.atan2(direction.x) + (self.random() - 0.5) * 0.45; self.particles.push(Particle { position, velocity: Vec2::new(angle.cos(), angle.sin()) * (30.0 + self.random() * 35.0), life: 0.12, max_life: 0.12, radius: 2.5, kind: ParticleKind::Muzzle }); }
    }
    pub fn ricochet(&mut self, position: Vec2, normal: Vec2) {
        for _ in 0..7 { let tangent = Vec2::new(-normal.y, normal.x); let direction = (normal + tangent * ((self.random() - 0.5) * 1.4)).normalized(); self.particles.push(Particle { position, velocity: direction * (35.0 + self.random() * 60.0), life: 0.24, max_life: 0.24, radius: 1.7, kind: ParticleKind::Spark }); }
    }
    pub fn explosion(&mut self, position: Vec2) {
        for _ in 0..28 { let angle = self.random() * std::f32::consts::TAU; let speed = 25.0 + self.random() * 110.0; self.particles.push(Particle { position, velocity: Vec2::new(angle.cos(), angle.sin()) * speed, life: 0.35 + self.random() * 0.45, max_life: 0.8, radius: 2.0 + self.random() * 3.0, kind: ParticleKind::Explosion }); }
    }
}
''')

          write('src/audio.rs', r'''use std::time::Duration;
use rodio::{DeviceSinkBuilder, Source};

#[derive(Debug, Clone, Copy)]
pub enum SoundEvent { Fire, Ricochet, Pickup, Explosion, RoundWin }

pub struct AudioEngine { sink: Option<rodio::MixerDeviceSink>, pub enabled: bool }
impl AudioEngine {
    pub fn new(enabled: bool) -> Self { Self { sink: DeviceSinkBuilder::open_default_sink().ok(), enabled } }
    pub fn set_enabled(&mut self, enabled: bool) { self.enabled = enabled; }
    pub fn play(&self, event: SoundEvent) {
        if !self.enabled { return; }
        let Some(sink) = &self.sink else { return; };
        let (frequency, duration, volume) = match event { SoundEvent::Fire => (190.0, 0.07, 0.18), SoundEvent::Ricochet => (820.0, 0.045, 0.10), SoundEvent::Pickup => (640.0, 0.11, 0.12), SoundEvent::Explosion => (90.0, 0.22, 0.20), SoundEvent::RoundWin => (520.0, 0.32, 0.15) };
        sink.mixer().add(rodio::source::SineWave::new(frequency).take_duration(Duration::from_secs_f32(duration)).amplify_normalized(volume).fade_in(Duration::from_millis(4)).fade_out(Duration::from_millis(18)));
    }
}
''')

