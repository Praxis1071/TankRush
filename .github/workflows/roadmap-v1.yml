name: Direct roadmap v1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libasound2-dev
      - name: Apply roadmap patch
        run: python3 scripts/apply_roadmap.py
      - name: Verify
        run: |
          cargo fmt --all
          cargo test --all-targets --all-features
          cargo build --all-targets --all-features
          cargo clippy --all-targets --all-features -- -D warnings -A dead_code -A unused_imports -A clippy::collapsible_if -A clippy::needless_range_loop -A clippy::option_map_unit_fn
      - name: Commit roadmap batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/roadmap-v1.yml .github/workflows/gameplay-v2.yml .github/workflows/tt2-final-tuning.yml scripts/apply_roadmap.py
          git add -A
          git commit -m "feat: implement gameplay roadmap batch" || exit 0
          git push
