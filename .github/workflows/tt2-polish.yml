name: One-time Tank Trouble source polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: ${{ !contains(github.event.head_commit.message, 'apply TT2 source polish') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install GTK4 development packages
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - name: Apply source polish
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('src/main.rs')
          source = path.read_text()

          source = source.replace(
              '    (0.20, 0.75, 1.0),\n    (1.0, 0.35, 0.35),\n    (0.35, 1.0, 0.45),\n    (1.0, 0.80, 0.25),',
              '    (0.25, 0.95, 0.35),\n    (0.95, 0.20, 0.22),\n    (0.20, 0.55, 1.0),\n    (1.0, 0.82, 0.18),',
          )
          source = source.replace(
              'weapon_uses: [u8; 4],\n    powerups:',
              'weapon_uses: [u8; 4],\n    guided_projectiles: Vec<game::ProjectileId>,\n    powerups:',
          )
          source = source.replace(
              '            weapon_uses: [0; 4],\n            powerups:',
              '            weapon_uses: [0; 4],\n            guided_projectiles: Vec::new(),\n            powerups:',
          )
          source = source.replace(
              '        self.weapon_uses = [0; 4];\n        self.ai_id = None;',
              '        self.weapon_uses = [0; 4];\n        self.guided_projectiles.clear();\n        self.ai_id = None;',
          )
          source = source.replace(
              '            self.simulation.state.add_tank(id, spawns[1]);\n            self.ai_id = Some(id);',
              '            self.simulation.state.add_tank(id, spawns[1]);\n            self.weapons[id.0 as usize] = Some(PowerUpKind::Laser);\n            self.weapon_uses[id.0 as usize] = u8::MAX;\n            self.ai_id = Some(id);',
          )
          source = source.replace(
              '            pairs.push((ai_id, ai.input(&self.simulation.state, ai_id, dt)));',
              '            pairs.push((ai_id, ai.input(&self.simulation.state, &self.simulation.map, &self.simulation.config, ai_id, dt)));',
          )
          source = source.replace(
              '        self.weapon_uses[index] = self.weapon_uses[index].saturating_sub(1);',
              '        if kind == PowerUpKind::GuidedMissile {\n            if let Some(projectile) = self.simulation.state.projectiles.iter().rev().find(|p| p.owner == owner) {\n                self.guided_projectiles.push(projectile.id);\n            }\n        }\n        self.weapon_uses[index] = self.weapon_uses[index].saturating_sub(1);',
          )
          source = source.replace(
              '            if self.weapons[owner_tank.player_id.0 as usize] == Some(PowerUpKind::GuidedMissile) {',
              '            if self.guided_projectiles.contains(&projectile.id) {',
          )
          source = source.replace(
              '        }\n    }\n\n    fn toggle_pause',
              '        }\n        self.guided_projectiles.retain(|id| self.simulation.state.projectiles.iter().any(|p| p.id == *id));\n    }\n\n    fn toggle_pause',
              1,
          )
          source = source.replace(
              'about.append(&Label::new(Some("Mehmet Boztepe")));',
              'about.append(&Label::new(Some("Praxis1071")));',
          )

          source = source.replace(
              '    context.set_source_rgb(0.055, 0.075, 0.085);\n    context.rectangle(',
              '    context.set_source_rgb(0.88, 0.89, 0.90);\n    context.rectangle(',
          )
          source = source.replace(
              '    context.fill().ok();\n\n    context.set_source_rgb(0.17, 0.21, 0.24);\n    for wall in &simulation.map.walls {',
              '    context.fill().ok();\n\n    context.set_source_rgb(0.82, 0.83, 0.84);\n    context.set_line_width(1.0);\n    for x in (0..=simulation.map.width as i32).step_by(32) {\n        context.move_to(x as f64, 0.0);\n        context.line_to(x as f64, simulation.map.height as f64);\n    }\n    for y in (0..=simulation.map.height as i32).step_by(32) {\n        context.move_to(0.0, y as f64);\n        context.line_to(simulation.map.width as f64, y as f64);\n    }\n    context.stroke().ok();\n\n    context.set_source_rgb(0.16, 0.17, 0.18);\n    for wall in &simulation.map.walls {',
          )
          source = source.replace(
              '        context.fill().ok();\n    }\n\n    for powerup in &runtime.powerups {',
              '        context.fill().ok();\n        context.set_source_rgb(0.32, 0.33, 0.34);\n        context.set_line_width(2.0);\n        context.rectangle(wall.min.x as f64, wall.min.y as f64, (wall.max.x - wall.min.x) as f64, (wall.max.y - wall.min.y) as f64);\n        context.stroke().ok();\n    }\n\n    for powerup in &runtime.powerups {',
              1,
          )

          powerup_block = '''    for powerup in &runtime.powerups {
        let color = match powerup.kind {
            PowerUpKind::DoubleShot => (0.15, 0.65, 0.25),
            PowerUpKind::MachineGun => (0.88, 0.22, 0.20),
            PowerUpKind::Laser => (0.15, 0.72, 0.95),
            PowerUpKind::GuidedMissile => (0.55, 0.28, 0.90),
            PowerUpKind::Shrapnel => (0.95, 0.52, 0.12),
        };
        context.save().ok();
        context.translate(powerup.position.x as f64, powerup.position.y as f64);
        context.rotate(std::f64::consts::FRAC_PI_4);
        context.set_source_rgb(0.12, 0.12, 0.13);
        context.rectangle(-12.0, -12.0, 24.0, 24.0);
        context.fill().ok();
        context.set_source_rgb(color.0, color.1, color.2);
        context.rectangle(-9.0, -9.0, 18.0, 18.0);
        context.fill().ok();
        context.restore().ok();
        context.set_source_rgb(0.08, 0.08, 0.09);
        context.set_font_size(8.0);
        context.move_to((powerup.position.x - 20.0) as f64, (powerup.position.y + 25.0) as f64);
        context.show_text(powerup.kind.label()).ok();
    }

'''
          source = re.sub(r'    for powerup in &runtime\.powerups \{.*?\n    \}\n\n    for projectile in &simulation\.state\.projectiles \{', powerup_block + '    for projectile in &simulation.state.projectiles {', source, count=1, flags=re.S)

          tank_block = '''    for projectile in &simulation.state.projectiles {
        let direction = projectile.velocity.normalized();
        context.set_source_rgb(0.20, 0.20, 0.21);
        context.set_line_width(2.0);
        context.move_to((projectile.position.x - direction.x * 9.0) as f64, (projectile.position.y - direction.y * 9.0) as f64);
        context.line_to(projectile.position.x as f64, projectile.position.y as f64);
        context.stroke().ok();
        context.set_source_rgb(0.08, 0.08, 0.09);
        context.arc(projectile.position.x as f64, projectile.position.y as f64, 4.0, 0.0, std::f64::consts::TAU);
        context.fill().ok();
    }
    for tank in &simulation.state.tanks {
        if !tank.alive { continue; }
        let is_laika = tank.player_id == runtime.ai_id.unwrap_or(PlayerId(255));
        let color = if is_laika { (0.36, 0.37, 0.39) } else { PLAYER_COLORS[tank.player_id.0 as usize % PLAYER_COLORS.len()] };
        context.save().ok();
        context.translate(tank.position.x as f64, tank.position.y as f64);
        context.rotate(tank.rotation_radians as f64);
        context.set_source_rgb(0.10, 0.10, 0.11);
        context.rectangle(-16.0, -12.0, 32.0, 24.0);
        context.fill().ok();
        context.set_source_rgb(color.0, color.1, color.2);
        context.rectangle(-13.0, -9.0, 26.0, 18.0);
        context.fill().ok();
        context.set_source_rgb(0.08, 0.08, 0.09);
        context.set_line_width(3.0);
        context.move_to(-11.0, -10.0); context.line_to(11.0, -10.0);
        context.move_to(-11.0, 10.0); context.line_to(11.0, 10.0);
        context.stroke().ok();
        context.arc(0.0, 0.0, 7.0, 0.0, std::f64::consts::TAU);
        context.set_source_rgb(color.0 * 0.75, color.1 * 0.75, color.2 * 0.75);
        context.fill().ok();
        context.set_source_rgb(0.10, 0.10, 0.11);
        context.set_line_width(5.0);
        context.move_to(3.0, 0.0); context.line_to(24.0, 0.0); context.stroke().ok();
        if is_laika {
            context.set_source_rgb(0.85, 0.12, 0.12);
            context.arc(-2.5, -2.5, 1.7, 0.0, std::f64::consts::TAU); context.fill().ok();
            context.arc(2.5, -2.5, 1.7, 0.0, std::f64::consts::TAU); context.fill().ok();
        }
        context.restore().ok();
        context.set_source_rgb(0.12, 0.12, 0.13);
        context.set_font_size(11.0);
        context.move_to((tank.position.x - 24.0) as f64, (tank.position.y - 20.0) as f64);
        context.show_text(&runtime.player_name(tank.player_id)).ok();
    }
    context.restore().ok();

'''
          source = re.sub(r'    for projectile in &simulation\.state\.projectiles \{.*?\n    context\.restore\(\)\.ok\(\);\n', tank_block, source, count=1, flags=re.S)

          path.write_text(source)
          PY
      - name: Format
        run: cargo fmt --all
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Build
        run: cargo build --all-targets --all-features
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -A dead_code -A unused_imports -A clippy::collapsible_if -A clippy::needless_range_loop -A clippy::option_map_unit_fn
      - name: Commit polished source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs
          git diff --cached --quiet || git commit -m "feat: apply TT2 source polish"
          git push
          git rm .github/workflows/tt2-polish.yml
          git commit -m "chore: remove one-time TT2 polish workflow"
          git push
