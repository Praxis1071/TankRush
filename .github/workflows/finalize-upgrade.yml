name: Finalize TankRush Upgrade
on:
  push:
    paths:
      - 'scripts/finalize_upgrade.py'
      - '.github/workflows/finalize-upgrade.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: python3 scripts/finalize_upgrade.py
      - run: cargo fmt --all
      - run: cargo test --all-targets --all-features
      - run: cargo build --all-targets
      - run: cargo clippy --all-targets --all-features -- -D warnings -A dead_code -A unused_imports -A clippy::collapsible_if -A clippy::needless_range_loop -A clippy::option_map_unit_fn
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.rs src/game/powerup.rs
          git commit -m 'feat: finalize TankRush gameplay and weapon presentation' || true
          git push origin HEAD:main
