name: Direct gameplay v2 patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install GTK4 development packages
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - name: Improve AI and guided weapons
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          ai = Path('src/game/ai.rs')
          s = ai.read_text()
          s = s.replace(
              'use super::{collision, GameConfig, GameMap, GameState, PlayerId, TankInput, Vec2};',
              'use super::{collision, GameConfig, GameMap, GameState, PlayerId, PowerUp, TankInput, Vec2};'
          )
          s = s.replace(
              '        config: &GameConfig,\n        self_id: PlayerId,',
              '        config: &GameConfig,\n        powerups: &[PowerUp],\n        self_id: PlayerId,'
          )
          needle = '        let to_target = target.position - tank.position;\n        let distance = to_target.length();'
          replacement = '''        let to_target = target.position - tank.position;
        let distance = to_target.length();
        let powerup_goal = powerups
            .iter()
            .filter_map(|powerup| {
                let distance = (powerup.position - tank.position).length();
                (distance < 300.0 && distance + 30.0 < distance_to_target(tank.position, target.position))
                    .then_some((distance, powerup.position))
            })
            .min_by(|a, b| a.0.total_cmp(&b.0))
            .map(|(_, position)| position);
        let objective = if powerup_goal.is_some() && projectile_threat(state, tank.position, config.tank_radius) <= 0.0 {
            powerup_goal.unwrap()
        } else {
            target.position
        };'''
          if needle not in s:
              raise SystemExit('AI objective marker not found')
          s = s.replace(needle, replacement)
          s = s.replace(
              '        let direct_angle = to_target.y.atan2(to_target.x);',
              '        let direct_angle = to_target.y.atan2(to_target.x);\n        let objective_delta = objective - tank.position;\n        let objective_angle = objective_delta.y.atan2(objective_delta.x);'
          )
          s = s.replace(
              '            let to_waypoint = waypoint - tank.position;\n            if to_waypoint.length() > 24.0 {\n                desired_angle = to_waypoint.y.atan2(to_waypoint.x);',
              '            let to_waypoint = waypoint - tank.position;\n            if to_waypoint.length() > 24.0 {\n                desired_angle = to_waypoint.y.atan2(to_waypoint.x);'
          )
          s = s.replace(
              '        let threat = projectile_threat(state, tank.position, config.tank_radius);',
              '        let threat = projectile_threat(state, tank.position, config.tank_radius);\n        if powerup_goal.is_some() && threat <= 0.0 && distance > 160.0 {\n            desired_angle = objective_angle;\n        }'
          )
          s = s.replace(
              'fn angle_delta(target: f32, current: f32) -> f32 {',
              'fn distance_to_target(origin: Vec2, target: Vec2) -> f32 {\n    (target - origin).length()\n}\n\nfn angle_delta(target: f32, current: f32) -> f32 {'
          )
          s = s.replace(
              '        let input = controller.input(&sim.state, &sim.map, &sim.config, ai, 1.0 / 60.0);',
              '        let input = controller.input(&sim.state, &sim.map, &sim.config, &[], ai, 1.0 / 60.0);'
          )
          ai.write_text(s)

          main = Path('src/main.rs')
          s = main.read_text()
          s = s.replace(
              '    paused: bool,\n}',
              '    paused: bool,\n    guided_projectiles: Vec<game::ProjectileId>,\n}'
          )
          s = s.replace(
              '            paused: false,\n        };',
              '            paused: false,\n            guided_projectiles: Vec::new(),\n        };'
          )
          s = s.replace(
              '        self.paused = false;\n        let spawns',
              '        self.paused = false;\n        self.guided_projectiles.clear();\n        let spawns'
          )
          s = s.replace(
              '                    projectile.remaining_lifetime = 5.0;\n                }',
              '                    projectile.remaining_lifetime = 5.0;\n                    let projectile_id = projectile.id;\n                    self.guided_projectiles.push(projectile_id);\n                }'
          )
          old = '''    fn guide_projectiles(&mut self) {
        for projectile in &mut self.simulation.state.projectiles {
            let Some(owner_tank) = self
                .simulation
                .state
                .tanks
                .iter()
                .find(|t| t.player_id == projectile.owner)
            else {
                continue;
            };
            let Some(target) = self
                .simulation
                .state
                .tanks
                .iter()
                .filter(|t| t.alive && t.player_id != projectile.owner)
                .min_by(|a, b| {
                    ((a.position - projectile.position).length())
                        .total_cmp(&((b.position - projectile.position).length()))
                })
            else {
                continue;
            };
            if self.weapons[owner_tank.player_id.0 as usize] == Some(PowerUpKind::GuidedMissile) {
                let desired = (target.position - projectile.position).normalized();
                let speed = projectile.velocity.length();
                projectile.velocity =
                    (projectile.velocity.normalized() * 0.88 + desired * 0.12).normalized() * speed;
            }
        }
    }'''
          new = '''    fn guide_projectiles(&mut self) {
        self.guided_projectiles.retain(|id| {
            self.simulation
                .state
                .projectiles
                .iter()
                .any(|projectile| projectile.id == *id)
        });
        let targets = self
            .simulation
            .state
            .tanks
            .iter()
            .filter(|tank| tank.alive)
            .map(|tank| (tank.player_id, tank.position))
            .collect::<Vec<_>>();
        for projectile in &mut self.simulation.state.projectiles {
            if !self.guided_projectiles.contains(&projectile.id) {
                continue;
            }
            let Some((_, target_position)) = targets
                .iter()
                .filter(|(id, _)| *id != projectile.owner)
                .min_by(|a, b| {
                    ((a.1 - projectile.position).length())
                        .total_cmp(&((b.1 - projectile.position).length()))
                })
            else {
                continue;
            };
            let desired = (*target_position - projectile.position).normalized();
            let speed = projectile.velocity.length();
            projectile.velocity =
                (projectile.velocity.normalized() * 0.84 + desired * 0.16).normalized() * speed;
        }
    }'''
          if old not in s:
              raise SystemExit('guided projectile function marker not found')
          s = s.replace(old, new)
          s = s.replace(
              '                    &self.simulation.config,\n                    ai_id,\n                    dt,',
              '                    &self.simulation.config,\n                    &self.powerups,\n                    ai_id,\n                    dt,'
          )
          main.write_text(s)
          PY
      - name: Format and verify
        run: |
          cargo fmt --all
          cargo test --all-targets --all-features
          cargo build --all-targets --all-features
          cargo clippy --all-targets --all-features -- -D warnings -A dead_code -A unused_imports -A clippy::collapsible_if -A clippy::needless_range_loop -A clippy::option_map_unit_fn
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/gameplay-v2.yml
          git add src/main.rs src/game/ai.rs .github/workflows/gameplay-v2.yml
          git commit -m "feat: deepen Laika tactics and guided weapons"
          git push
